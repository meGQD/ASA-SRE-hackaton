services:
  api:
    build: ./src/api
    container_name: api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    depends_on:
      - redis
      - postgres

  ui:
    build: ./src/ui
    container_name: ui
    restart: always
    ports:
      - "80:80"

  redis:
    image: redis:7-alpine3.21
    container_name: redis
    restart: always
    ports:
    - "6379:6379"

  postgres:
    image: postgres:15-alpine3.22
    container_name: postgres
    restart: always
    # Store DataBase data to postgres_data
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data
      # - POSTGRES_HOST_AUTH_METHOD: trust

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: prometheus
    restart: always
    volumes:
      - ./monitoring/etc/prometheus/:/etc/prometheus/
      - ./monitoring/etc/prometheus/rules/:/etc/prometheus/rules/
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.config.file=/etc/prometheus/web.yml'
      - '--web.page-title=Prometheus'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9091:9090"

volumes:
  postgres_data:
  prometheus_data:
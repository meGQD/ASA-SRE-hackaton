.deploy_rules:
  stage: deploy
  before_script:
    - export IMAGE_TAG=$CI_COMMIT_SHORT_SHA

deploy api:
  extends: .deploy_rules
  needs:
    - job: "build api"
      # optional: true
  script:
    - echo "Deploying API..."

    - export DB_USER=$DB_USER
    - export DB_PASSWORD=$DB_PASSWORD

    - docker compose up -d
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "src/api/**/*"
        - ".gitlab-ci.yml"
        - "pipelines/deploy.yml"
  tags:
    - deploy

deploy ui:
  extends: .deploy_rules
  needs:
    - job: "build ui"
      # optional: true
  script:
    - echo "Deploying UI..."
    - docker compose up -d
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "src/ui/**/*"
        - ".gitlab-ci.yml"
        - "pipelines/deploy.yml"
  tags:
    - deploy
